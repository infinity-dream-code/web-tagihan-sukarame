<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Offline | MIT Muhammadiyah Sukarame</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0c1610;
      color: #eef6f0;
      padding: 1.25rem;
    }
    .card {
      width: min(420px, 100%);
      background: #15241b;
      border: 1px solid #2a4033;
      border-radius: 18px;
      padding: 1.5rem 1.25rem;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0,0,0,.25);
    }
    img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; margin-bottom: .85rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.15rem; }
    p { margin: 0 0 1.15rem; color: #b7c9bc; font-size: .95rem; line-height: 1.5; }
    button {
      min-height: 46px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #4ade80;
      color: #052e16;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/mit.png" alt="MIT Muhammadiyah Sukarame">
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet terputus. Periksa jaringan Anda, lalu coba lagi untuk cek atau bayar tagihan.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
